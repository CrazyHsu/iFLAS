# Isolated environment for differential splicing + functional enrichment.
#   conda env create -f environment-diffsplice.yml
# Needed by `iflas diff_as` / `iflas go` / R-backed report plots. Kept separate because rMATS + the R/
# bioconductor stack are the heaviest and most pin-prone deps. iFLAS (core env) runs
# them inside this env (`Rscript`, `rmats.py`). R 4.5 / Bioconductor 3.22 tested;
# exact builds: envs/lock/iflas-diffsplice.linux-64.txt.
name: iflas-diffsplice
channels:
  - conda-forge
  - bioconda
dependencies:
  - "rmats>=4.3,<4.5"                       # rMATS-turbo
  - "r-base>=4.5,<4.6"
  - "bioconductor-deseq2>=1.50,<1.51"
  - "bioconductor-clusterprofiler>=4.18,<4.19"
  - "bioconductor-gviz>=1.54,<1.55"
  - "bioconductor-go.db>=3.22,<3.23"
  - "bioconductor-annotationdbi>=1.72,<1.73"
  - "bioconductor-genomicfeatures>=1.62,<1.63"
  - "bioconductor-txdbmaker>=1.6,<1.7"      # makeTxDbFromGFF moved here; defunct in GenomicFeatures >= 1.61.1 (BUG-164)
  - "bioconductor-rtracklayer>=1.70,<1.71"
  - r-plyr
  - "r-dplyr>=1.1,<2"
  - r-tibble
  - r-tidyr
  - "r-ggplot2>=4.0,<4.1"
  - r-scales
  - r-stringr
  - r-stringi
  - r-rcolorbrewer
  - r-gridbase
  - r-valr
  - r-ggpubr
  - r-venndiagram              # utils/venn.R (characterize NGS-vs-LR overlap plots)
